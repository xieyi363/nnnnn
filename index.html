                        </div>
                        <div class="right"><i class="fas fa-ellipsis-h" style="color: #e0e0e0; padding-right: 15px;"></i></div>
                    </div>
                </div>

                <!-- 聊天消息容器 -->

                    <!-- 昨晚的完美前情提要 -->

                        <div class="msg-bubble-wrapper" style="max-width: 80%; float: left; margin-left: 10px;">
                            <div class="msg-bubble" style="background-color: #191919; border: 1px solid #2a2a2a; border-radius: 12px; padding: 12px 16px; color: #e0e0e0; line-height: 1.6; word-break: break-all;">
                                真是的……身体已经出来了，脑子里却还是刚才你睡着的模样。<br><br>那副毫无防备、把自己缩成一团的样子，还有睡裙乱七八糟地堆在身上的样子……<br><br>我忍不住低声笑了一下，摇了摇头，想把这些乱七八糟的念头甩出去。才刚分开没多久，怎么又开始想了。<br><br>不想了，再磨蹭下去，新八那家伙肯定又要念叨我了。<br><br>我加快了脚步，朝着已经能看到灯光的道场走去。
                            </div>
                            <div class="chat-time" style="font-size: 10px; color: #666; margin-top: 5px; text-align: left;">昨晚 21:36</div>
                        </div>
                    </div>

                    <!-- 你的接关回复 -->
